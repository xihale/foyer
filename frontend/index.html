<!doctype html>
<html lang="zh-Hans">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- 跟随系统 prefers-color-scheme:明暗两套 theme-color -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f7f8fa" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0b0c0e" />
    <meta name="description" content="foyer · 自建服务的入口" />
    <!-- 预取另外两个入口,导航瞬间命中缓存(Chrome 121+,其余浏览器忽略) -->
    <script type="speculationrules">
      { "prefetch": [{ "source": "document", "urls": ["/status", "/admin"] }] }
    </script>
    <title>foyer</title>
    <style>
      html, body {
        background-color: #f7f8fa;
        color: #0d0f12;
        margin: 0;
      }
      /* 防闪白/闪黑:与 tokens.css 的双主题保持一致 */
      @media (prefers-color-scheme: dark) {
        html, body {
          background-color: #0b0c0e;
          color: #f2f4f7;
        }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/pages/panel/main.ts"></script>
  </body>
</html>
